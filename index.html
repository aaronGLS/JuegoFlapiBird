<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Pro - v2.0</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="¡El clásico juego de Flappy Bird! Toca para volar y evita los obstáculos.">
    <meta name="theme-color" content="#e86101">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flapy Bird">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Iconos -->
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">

    <!-- Tailwind CSS para la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="game-container">
        <!-- UI: Pantalla de Carga -->
        <div id="loading-screen">
            <h1 class="loading-title">CARGANDO...</h1>
            <div class="progress-container">
                <div id="progress-fill" class="progress-bar"></div>
            </div>
            <span id="progress-text" class="progress-text">0%</span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- UI: Pantalla de Inicio -->
        <div id="start-screen"
            class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none ui-layer">
            <h1 class="game-title text-white font-bold text-stroke tracking-widest pixel-font animate-float">FLAPPY BIRD
            </h1>
            <div class="bg-white/90 border-4 border-black p-6 rounded-lg shadow-lg text-center ui-layer panel-box">
                <div class="panel-inner">
                    <p class="text-2xl text-black font-bold mb-2">TOCA O ESPACIO</p>
                    <p class="text-xl text-gray-700">PARA COMENZAR</p>
                </div>
            </div>
        </div>

        <!-- UI: HUD de Puntuación -->
        <div id="score-hud" class="absolute top-10 w-full text-center pointer-events-none fade-hidden ui-layer">
            <span id="current-score" class="text-6xl text-white font-bold text-stroke pixel-font current-score">0</span>
        </div>

        <!-- UI: Botón de Pausa -->
        <button id="pause-btn"
            class="absolute top-4 right-4 btn-icon fade-hidden ui-layer z-10 transition-transform hover:scale-110">
            ⏸️
        </button>

        <!-- UI: Controles de Música (siempre visible) -->
        <div id="music-controls" class="absolute top-4 left-4 flex items-center gap-2 z-10">
            <button id="music-btn" class="btn-icon transition-transform hover:scale-110">
                <span>🎵</span>
            </button>
            <input id="volume-slider" type="range" min="0" max="1" step="0.1" value="0.3"
                class="w-24 h-2 bg-white/60 rounded-lg appearance-none cursor-pointer accent-orange-500 shadow-md">
        </div>

        <!-- UI: Pantalla de Pausa -->
        <div id="pause-screen"
            class="absolute inset-0 flex flex-col items-center justify-center bg-black/50 fade-hidden ui-layer z-30">
            <div class="panel-box text-center transform transition-all">
                <div class="panel-inner">
                    <h2 class="text-5xl text-[#543847] font-bold mb-6 text-stroke pixel-font">PAUSA</h2>
                    <p class="text-xl text-[#543847] mb-8 font-bold">JUEGO DETENIDO</p>
                    <button id="resume-btn" class="btn-3d btn-green text-2xl py-3 px-8 w-full">
                        CONTINUAR ▶️
                    </button>
                </div>
            </div>
        </div>

        <!-- UI: Pantalla de Game Over -->
        <div id="game-over-screen"
            class="absolute inset-0 flex flex-col items-center justify-center bg-black/40 fade-hidden ui-layer z-20">
            <h2 class="text-6xl text-[#e86101] font-bold text-stroke mb-8 pixel-font animate-float">GAME OVER</h2>

            <div class="panel-box relative mb-8">
                <div class="panel-inner flex flex-col gap-4">
                    <div class="flex flex-row justify-between items-center px-2">
                        <!-- Sección Medalla -->
                        <div class="flex flex-col items-center w-1/3">
                            <span class="text-[#e86101] text-lg font-bold text-stroke-sm mb-2 pixel-font">MEDALLA</span>
                            <div id="medal-display" class="medal-slot">
                                <div class="medal-shine"></div>
                                <div id="medal-icon" class="text-2xl font-bold text-white text-shadow hidden"></div>
                            </div>
                        </div>

                        <!-- Sección Puntuación -->
                        <div class="flex flex-col w-2/3 items-end pr-2 gap-4">
                            <div class="text-right">
                                <span
                                    class="text-[#e86101] text-sm font-bold text-stroke-sm block mb-1 pixel-font">SCORE</span>
                                <span id="final-score"
                                    class="text-4xl text-white font-bold text-stroke pixel-font">0</span>
                            </div>
                            <div class="text-right">
                                <span
                                    class="text-[#e86101] text-sm font-bold text-stroke-sm block mb-1 pixel-font">BEST</span>
                                <span id="best-score"
                                    class="text-4xl text-white font-bold text-stroke pixel-font">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button id="restart-btn" class="btn-3d btn-orange text-2xl py-3 px-8 transition-transform hover:scale-105">
                JUGAR DE NUEVO ↺
            </button>
        </div>

        <div id="flash-overlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-50"></div>
    </div>

    <!-- Módulo principal del juego -->
    <script type="module" src="js/game.js"></script>

    <!-- Registro del Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrado:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>

</body>

</html>
